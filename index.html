<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Danajet helps authors create, publish, and share professional books."
    />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>Danajet | Helping Authors Make Their Books Soar</title>
    <style>
      .initial-page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #f7f4ee;
      }
      .initial-page-loader__wheel {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(240, 73, 17, 0.2);
        border-top-color: #f04911;
        border-radius: 50%;
        animation: initial-page-spin 0.75s linear infinite;
      }
      @keyframes initial-page-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .initial-page-loader { background: #111; }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-page-loader__wheel { animation-duration: 1.5s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-page-loader" role="status" aria-label="Loading Danajet">
        <span class="initial-page-loader__wheel" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
